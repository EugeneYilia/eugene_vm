appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} - {l} -{t} - {m} 999 {n}"

  file:
    kind: file
    path: "log/eugene_vm.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} - {l} - {t} - {m}{n}"

# Set the default logging level to "warn" and attach the "stdout" appender to the root
root:
  level: info
  appenders:
    - stdout

loggers:
  # Route log events sent to the "app" logger to the "file" appender,
  # and *not* the normal appenders installed at the root
  app:
    level: info
    appenders:
      - file
    additive: false